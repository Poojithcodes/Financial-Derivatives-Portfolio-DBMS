{% extends 'base.html' %}{% block content %}<h1 class="h2">User administration</h1><div class="card"><div class="table-responsive"><table class="table mb-0"><thead><tr><th>Name</th><th>Email</th><th>Role</th><th>Active</th><th>Created</th><th>Change role</th></tr></thead><tbody>{% for u in users %}<tr><td>{{ u.full_name }}</td><td>{{ u.email }}</td><td>{{ u.role }}</td><td>{{ u.is_active }}</td><td>{{ u.created_at }}</td><td>{% if u.id != session.user_id %}<form method="post" action="{{ url_for('web.update_role', user_id=u.id) }}" class="d-flex gap-2"><select class="form-select form-select-sm" name="role">{% for role in ['TRADER','ADMINISTRATOR','AUDITOR'] %}<option {% if role==u.role %}selected{% endif %}>{{ role }}</option>{% endfor %}</select><button class="btn btn-sm btn-outline-primary">Save</button></form>{% else %}Current user{% endif %}</td></tr>{% endfor %}</tbody></table></div></div>{% endblock %}
